name: Build Pumpkin-RPG

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: cargo-reg-${{ runner.os }}

      - name: Clone Pumpkin-MC
        run: |
          rm -rf pumpkin
          git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git pumpkin
          echo "Pumpkin commit: $(cd pumpkin && git rev-parse --short HEAD)"
          ls pumpkin/Cargo.toml

      - name: Apply patches
        run: bash scripts/apply-patches.sh

      - name: Add plugin to workspace
        run: |
          cp -r plugin pumpkin/pumpkin-rpg-plugin
          sed -i '/^members = \[/a \  "pumpkin-rpg-plugin",' pumpkin/Cargo.toml
          echo "Workspace members:"
          grep -A15 'members' pumpkin/Cargo.toml | head -16

      - name: Build
        working-directory: pumpkin
        run: cargo build --release -p pumpkin -p pumpkin-rpg-plugin 2>&1 | tee ../build.log

      - name: Upload server binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-server
          path: pumpkin/target/release/pumpkin
          retention-days: 30

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-rpg-plugin
          path: pumpkin/target/release/libpumpkin_rpg_plugin.so
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
