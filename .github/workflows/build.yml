name: Build Pumpkin-RPG

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            pumpkin/target/
            ~/.cargo/registry/
            ~/.cargo/git/
          key: pumpkin-rpg-${{ hashFiles('pumpkin/Cargo.lock') }}
          restore-keys: pumpkin-rpg-

      - name: Run setup
        run: bash scripts/setup.sh

      - name: Build
        working-directory: pumpkin
        run: cargo build --release --workspace 2>&1 | tee build.log

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-server
          path: pumpkin/target/release/pumpkin
          retention-days: 30

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-rpg-plugin
          path: pumpkin/target/release/libpumpkin_rpg_plugin.so
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: pumpkin/build.log
          retention-days: 7