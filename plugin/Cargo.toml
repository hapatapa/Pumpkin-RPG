[package]
name = "pumpkin-rpg-plugin"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "RPG combat, leveling, loot, bosses, and custom camera angles (MC Dungeons style) for Pumpkin-MC"
authors = ["RPG Plugin"]

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin = { path = "../pumpkin" }
pumpkin-api-macros = { path = "../pumpkin-api-macros" }
pumpkin-protocol = { path = "../pumpkin-protocol", features = ["default"] }
pumpkin-util = { path = "../pumpkin-util" }
pumpkin-data = { path = "../pumpkin-data" }
pumpkin-macros = { path = "../pumpkin-macros" }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }
dashmap.workspace = true
uuid.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[lints]
workspace = true
